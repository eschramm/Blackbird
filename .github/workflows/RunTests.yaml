name: RunTests

# `local` is the branch this fork releases from; `main` tracks upstream.
on:
  push:
    branches:
      - "main"
      - "local"
  pull_request:
    branches:
      - "**"

jobs:
  run-tests:

    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test

  run-tests-linux:

    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Install SQLite
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Verify swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
